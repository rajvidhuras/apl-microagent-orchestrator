apiVersion: v1
kind: Service
metadata:
  name: quote-api
spec:
  selector:
    app: quote-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
    spec:
      containers:
        - name: quote-api
          image: ghcr.io/swagger-api/quote:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUOTE_THEME
              value: "tech"
          # Example endpoints exposed by the app:
          # GET /api/quote
          # POST /api/quote
