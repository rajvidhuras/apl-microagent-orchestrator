version: "3.9"
services:
  httpbin:
    image: kennethreitz/httpbin
    ports: ["8080:80"]
    description: "Public HTTP request/response bin for testing clients"
    endpoints:
      - GET /get
      - POST /post
      - GET /anything/{path}
  petstore:
    image: swaggerapi/petstore
    ports: ["8081:8080"]
    description: "Swagger Petstore example API"
    endpoints:
      - GET /v2/pet/{petId}
      - POST /v2/pet
      - GET /v2/store/inventory
